events {}

http {
    server {
        listen 80;

        # Route pour ton application Java (API)
        location /api/ {
            proxy_pass http://app:8000;
            proxy_set_header Host $host;
        }

        # Route par défaut pour ton serveur PHP (Frontend / Web)
        location / {
            proxy_pass http://web:80;
            proxy_set_header Host $host;
        }
    }
}